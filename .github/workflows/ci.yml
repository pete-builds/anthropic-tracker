name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Re-compile requirements.lock
        run: |
          uv pip compile pyproject.toml \
            -o requirements.lock.regen \
            --generate-hashes \
            --python-version 3.13 \
            --no-header \
            --quiet

      - name: Fail if requirements.lock drifted from pyproject.toml
        run: |
          set -e
          if ! diff -q <(tail -n +3 requirements.lock) requirements.lock.regen > /dev/null; then
            echo "::error::requirements.lock is stale. Regenerate with: uv pip compile pyproject.toml -o requirements.lock --generate-hashes --python-version 3.13"
            diff -u <(tail -n +3 requirements.lock) requirements.lock.regen | head -50 || true
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=anthropic_tracker --cov-report=term-missing

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: anthropic-tracker:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + provenance produce a manifest list, which the docker
          # exporter can't load. This is a scan-only build (not published),
          # so skip both. Provenance/SBOM belong on the publish workflow.
          sbom: false
          provenance: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anthropic-tracker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
